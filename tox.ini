# Local multi-version runs (mirrors .github/workflows/test.yaml).
# With dev-local: `uv sync --group dev-local` then `uv run tox` (tox-uv builds envs via uv).
# Single env: `tox -e py312`  ·  Extra pytest args: `tox -- test_main.py -q` (cwd: tests/)

[tox]
env_list =
    py310
    py311
    py312
    py313
    py314
isolated_build = true
skip_missing_interpreters = true
requires =
    tox>=4.21
    tox-uv>=1.33.4

[testenv]
deps = pytest>=7
setenv =
    PYTEST_SESSION = 1
    PYTHONPATH = {toxinidir}
# Match tests/run_tests.sh and CI: fixtures use paths relative to tests/
changedir = {toxinidir}/tests
commands =
    pytest {posargs:.}
